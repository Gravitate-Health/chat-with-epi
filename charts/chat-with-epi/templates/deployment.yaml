apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chat-with-epi.fullname" . }}
  labels:
    {{- include "chat-with-epi.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "chat-with-epi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chat-with-epi.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ include "chat-with-epi.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "chat-with-epi.fullname" . }}
            - secretRef:
                name: {{ include "chat-with-epi.fullname" . }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
